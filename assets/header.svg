<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="Juan Jose Moreno Jaramillo — Full-stack developer, Colombia">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <style>
    .name {
      font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #1f2328;
      animation: rise .7s cubic-bezier(.22,1,.36,1) both;
    }
    .role {
      font: 400 15.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      fill: #656d76;
      animation: rise .7s cubic-bezier(.22,1,.36,1) .12s both;
    }
    .accent { fill: #0969da; }
    .rule {
      transform-origin: 0 0;
      animation: wipe .9s cubic-bezier(.22,1,.36,1) .22s both;
    }
    @keyframes rise  { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    @keyframes wipe  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-color-scheme: dark) {
      .name   { fill: #e6edf3; }
      .role   { fill: #8b949e; }
      .accent { fill: #58a6ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .name, .role, .rule { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <text class="name" x="0" y="62">Juan Jose Moreno Jaramillo</text>
  <text class="role" x="2" y="95">full-stack developer<tspan class="accent"> · </tspan>PHP/Symfony<tspan class="accent"> · </tspan>Node.js<tspan class="accent"> · </tspan>React</text>
  <g class="rule"><rect x="0" y="120" width="430" height="4" rx="2" fill="url(#accent)"/></g>
</svg>
